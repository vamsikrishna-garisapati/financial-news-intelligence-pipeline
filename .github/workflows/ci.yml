name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fnip
          POSTGRES_PASSWORD: fnip
          POSTGRES_DB: fnip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fnip -d fnip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://fnip:fnip@localhost:5432/fnip
      TEST_DATABASE_URL: postgresql+psycopg://fnip:fnip@localhost:5432/fnip_test
      APIFY_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create test database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=fnip psql -h localhost -U fnip -d fnip -c "CREATE DATABASE fnip_test;"

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run pytest -q
