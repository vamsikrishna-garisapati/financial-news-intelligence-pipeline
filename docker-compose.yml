services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fnip
      POSTGRES_PASSWORD: fnip
      POSTGRES_DB: fnip
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnip -d fnip"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fnip:fnip@db:5432/fnip
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
