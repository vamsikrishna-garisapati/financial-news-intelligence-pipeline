services:
  db:
    image: postgres:16-alpine
    environment:
      # Local Docker demo credentials only — not for production
      POSTGRES_USER: fnip
      POSTGRES_PASSWORD: fnip
      POSTGRES_DB: fnip
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnip -d fnip"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fnip:fnip@db:5432/fnip
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-vamsi-krishna/stock-market-news-collector}
      APIFY_TIMEOUT_SECS: ${APIFY_TIMEOUT_SECS:-300}
      APIFY_MAX_RETRIES: ${APIFY_MAX_RETRIES:-3}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COLLECTION_MAX_ITEMS: ${COLLECTION_MAX_ITEMS:-500}
      COLLECTION_MAX_TICKERS: ${COLLECTION_MAX_TICKERS:-20}
      COLLECTION_MAX_COMPANIES: ${COLLECTION_MAX_COMPANIES:-20}
      COLLECTION_MAX_SEARCH_QUERIES: ${COLLECTION_MAX_SEARCH_QUERIES:-10}
      COLLECTION_MAX_HOURS_BACK: ${COLLECTION_MAX_HOURS_BACK:-720}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-true}
      JOB_POLL_INTERVAL_SECS: ${JOB_POLL_INTERVAL_SECS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_DELAY_SECS: ${JOB_RETRY_DELAY_SECS:-30}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
