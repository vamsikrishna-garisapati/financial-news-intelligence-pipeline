[project]
name = "financial-news-intelligence-pipeline"
version = "0.1.0"
description = "Collect, process, store, and search financial news via Apify and PostgreSQL."
readme = "README.md"
authors = [
    { name = "Vamsi Krishna", email = "vamsikrishna.garisapati@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apify-client>=3.5.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fnip = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
